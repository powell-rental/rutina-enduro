<!doctype html>
<!--
  Rutina enduro — página de mudanza (2026-10-19)
  La rutina se mudó a https://erickiess.github.io/rutina-enduro/.
  POR QUÉ: powell-rental.github.io es el origen de la app del remito de Powell, y el
  localStorage es por origen, no por carpeta: cualquier app publicada acá puede leer el
  token de sync del remito. Este origen queda sólo para el remito (auditoría 19/10 §1.5).
  Qué hace esta página:
    1. Botón para bajar los datos de la rutina que quedaron en este celu (clave
       enduroGym.v1, mismo formato que "Exportar" → se importan en la dirección nueva).
    2. Desinstala el service worker de la rutina y borra sus cachés (enduro-gym-*).
  ⛔ NO toca nada más del origen: ni otras claves de localStorage, ni el service worker
     ni las cachés del remito (/remito/, remito-v*).
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<title>Rutina enduro — se mudó</title>
<style>
  :root{color-scheme:light dark}
  body{font:16px/1.5 system-ui,sans-serif;max-width:34rem;margin:0 auto;padding:24px 16px;background:#f6f6f4;color:#1b1b1b}
  @media (prefers-color-scheme:dark){body{background:#151515;color:#eee} a{color:#8cc4ff}}
  h1{font-size:1.5rem;margin:0 0 .5rem}
  .url{display:block;font-weight:700;font-size:1.1rem;margin:.75rem 0 1.25rem;word-break:break-all}
  button{font:inherit;font-weight:600;padding:.7rem 1rem;border-radius:10px;border:0;background:#e85d04;color:#fff}
  button[disabled]{opacity:.5}
  #msg{min-height:1.5em}
  ol{padding-left:1.25rem}
</style>
</head>
<body>
<h1>La rutina se mudó</h1>
<p>Nueva dirección:</p>
<a class="url" href="https://erickiess.github.io/rutina-enduro/">erickiess.github.io/rutina-enduro</a>
<ol>
  <li>Si tenías datos cargados acá, bajalos con el botón de abajo.</li>
  <li>Abrí la dirección nueva, instalala y en <b>Datos → Importar</b> elegí ese archivo.</li>
  <li>Borrá de la pantalla de inicio el ícono viejo.</li>
</ol>
<p><button id="exp" type="button">Descargar mis datos</button></p>
<p id="msg"></p>
<script>
(function(){
  'use strict';
  var KEY='enduroGym.v1';
  var msg=document.getElementById('msg');
  var btn=document.getElementById('exp');
  var datos=null;
  try{ datos=localStorage.getItem(KEY); }catch(e){}
  if(!datos){ btn.disabled=true; msg.textContent='En este celu no quedaron datos de la rutina.'; }

  // 1. Exportar: mismo JSON que guarda la app (S con v:1) → lo acepta "Importar".
  btn.onclick=function(){
    if(!datos) return;
    var b=new Blob([datos],{type:'application/json'});
    var u=URL.createObjectURL(b);
    var a=document.createElement('a');
    a.href=u; a.download='enduro-gym-copia.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(u); },1500);
    msg.textContent='Listo: importalo en la dirección nueva.';
  };

  // 2. Limpieza: sólo el SW con scope /rutina-enduro/ y las cachés enduro-gym-*.
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(function(rs){
      rs.forEach(function(r){ if(/\/rutina-enduro\/$/.test(r.scope)) r.unregister(); });
    }).catch(function(){});
  }
  if(window.caches){
    caches.keys().then(function(ks){
      ks.forEach(function(k){ if(k.indexOf('enduro-gym-')===0) caches.delete(k); });
    }).catch(function(){});
  }
})();
</script>
</body>
</html>
